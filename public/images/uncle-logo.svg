<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient: Warm Terracotta -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#df5935" />
      <stop offset="100%" stop-color="#af3819" />
    </linearGradient>

    <!-- Cheek Glow Gradient -->
    <radialGradient id="cheekGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f27d6b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#f27d6b" stop-opacity="0" />
    </radialGradient>

    <!-- Glass Reflection on Spectacles -->
    <linearGradient id="lensShine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95" />
      <stop offset="50%" stop-color="#f4f7f6" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#e2ebf0" stop-opacity="0.5" />
    </linearGradient>

    <!-- Idea Sparkle Glow -->
    <filter id="sparkleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#f39c12" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- 1. Background Rounded Squircle Container -->
  <rect x="20" y="20" width="472" height="472" rx="124" fill="url(#bgGrad)" />

  <!-- Subtle Inner Border Highlight -->
  <rect x="24" y="24" width="464" height="464" rx="120" fill="none" stroke="#ffffff" stroke-width="4" stroke-opacity="0.2" />

  <!-- 2. Uncle Head Base (Warm Ivory Skin) -->
  <!-- Ears -->
  <ellipse cx="108" cy="272" rx="26" ry="34" fill="#ffebd9" />
  <ellipse cx="404" cy="272" rx="26" ry="34" fill="#ffebd9" />
  <ellipse cx="108" cy="272" rx="14" ry="20" fill="#f5cfb5" />
  <ellipse cx="404" cy="272" rx="14" ry="20" fill="#f5cfb5" />

  <!-- Face -->
  <ellipse cx="256" cy="272" rx="148" ry="142" fill="#ffebd9" />

  <!-- Hair (Neat Modern Parting Hair) -->
  <path d="M 120 250 C 114 175 165 110 256 110 C 350 110 398 175 392 250 C 374 205 340 180 290 185 C 240 190 200 160 165 190 C 145 208 130 226 120 250 Z" fill="#2b2420" />

  <!-- Cheeks -->
  <circle cx="165" cy="336" r="24" fill="url(#cheekGlow)" />
  <circle cx="347" cy="336" r="24" fill="url(#cheekGlow)" />

  <!-- 3. Round Spectacles (Bold Friendly Glasses) -->
  <!-- Left Lens -->
  <circle cx="196" cy="272" r="50" fill="url(#lensShine)" stroke="#2b2420" stroke-width="16" />
  <!-- Right Lens -->
  <circle cx="316" cy="272" r="50" fill="url(#lensShine)" stroke="#2b2420" stroke-width="16" />
  <!-- Bridge -->
  <path d="M 246 272 Q 256 264 266 272" fill="none" stroke="#2b2420" stroke-width="14" stroke-linecap="round" />
  <!-- Left & Right Temples -->
  <line x1="146" y1="272" x2="114" y2="268" stroke="#2b2420" stroke-width="12" stroke-linecap="round" />
  <line x1="366" y1="272" x2="398" y2="268" stroke="#2b2420" stroke-width="12" stroke-linecap="round" />

  <!-- 4. Friendly Smiling Eyes inside Glasses -->
  <!-- Left Smiling Eye (Arc) -->
  <path d="M 178 274 Q 196 260 214 274" fill="none" stroke="#2b2420" stroke-width="10" stroke-linecap="round" />
  <!-- Right Smiling Eye (Arc) -->
  <path d="M 298 274 Q 316 260 334 274" fill="none" stroke="#2b2420" stroke-width="10" stroke-linecap="round" />

  <!-- Eye Brows -->
  <path d="M 172 208 Q 196 198 220 206" fill="none" stroke="#2b2420" stroke-width="9" stroke-linecap="round" />
  <path d="M 292 206 Q 316 198 340 208" fill="none" stroke="#2b2420" stroke-width="9" stroke-linecap="round" />

  <!-- 5. Cute Smile & Nose -->
  <!-- Nose (Tiny subtle arc) -->
  <path d="M 256 298 Q 260 306 254 310" fill="none" stroke="#d58b76" stroke-width="6" stroke-linecap="round" />
  <!-- Warm Smile -->
  <path d="M 226 342 Q 256 376 286 342" fill="none" stroke="#2b2420" stroke-width="12" stroke-linecap="round" />

  <!-- 6. Idea Sparkle (Uncle Note Inspiration) -->
  <g filter="url(#sparkleGlow)">
    <path d="M 390 100 Q 390 120 405 120 Q 390 120 390 140 Q 390 120 375 120 Q 390 120 390 100 Z" fill="#ffd32a" />
    <circle cx="414" cy="94" r="4" fill="#ffd32a" />
  </g>
</svg>
